name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit + API tests
        run: npm test
      - name: Release build
        run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: E2E smoke tests
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t night-vector:ci .
      - name: Run container and wait for healthy
        run: |
          docker run -d --name nv -p 8080:8080 -e PUBLIC_URL=http://localhost:8080 night-vector:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' nv)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' nv | grep -q healthy
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/ | grep -q 'NIGHT'
      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop -t 15 nv
          test "$(docker inspect -f '{{.State.ExitCode}}' nv)" = "0"
          docker logs nv | grep -q 'shutdown complete'
